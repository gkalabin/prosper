name: Lint

on:
  push:
  pull_request:

jobs:
  # Runs the polyglot lint suite defined in lefthook.yml.
  lefthook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version: '1.27'}
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          input: proto
          setup_only: true
      - run: cargo install typos-cli --version 1.52.2 --locked
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: binary
          install-only: true
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: npm install -g lefthook@2.2.2
      - run: npm ci # Install prettier
      - run: npm ci --prefix frontend
      - run: npm ci --prefix e2e
      - run: lefthook run lint
