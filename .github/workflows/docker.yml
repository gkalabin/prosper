name: Docker

on: push

jobs:
  build:
    name: Build and Push Docker Image with SHA Tag
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: ./Dockerfile
          push: true
          tags: gkalabin/prosper:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: Run E2E Tests
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    services:
      mysql-e2e:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prosper_e2e_test_db
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'e2e/package-lock.json'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: docker pull gkalabin/prosper:${{ github.sha }}
      - run: npx playwright test
        env:
          CI: 'true'
          E2E_DOCKER_IMAGE: 'gkalabin/prosper:${{ github.sha }}'

  tag-latest:
    name: Tag Image as Latest
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: tag-latest
      cancel-in-progress: true
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: docker pull gkalabin/prosper:${{ github.sha }}
      - run: docker tag gkalabin/prosper:${{ github.sha }} gkalabin/prosper:latest
      - run: docker push gkalabin/prosper:latest
